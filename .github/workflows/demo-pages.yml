name: Publish public demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "test/demo-site.test.js"
      - "test/demo-parity.test.js"
      - "package.json"
      - ".github/workflows/demo-pages.yml"
  pull_request:
    paths:
      - "demo/**"
      - "test/demo-site.test.js"
      - "test/demo-parity.test.js"
      - "package.json"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages-demo"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies without production postinstall
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Bundle standalone demo including OpenCC
        run: npm run build:demo
      - name: Validate demo and compiled output
        run: |
          node --check demo/app.js
          node --check demo/features.js
          node --test test/demo-site.test.js test/demo-parity.test.js
          test -s demo-dist/index.html
          test -d demo-dist/assets

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    # The repository Pages source is GitHub Actions. Deploy on each main
    # push, and never publish unreviewed pull-request artifacts.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and compile static demo
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:demo
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the standalone demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo-dist
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
